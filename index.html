<script>
'use strict';

const VERSION=73, STORE='HOUSE_FILE_GAME2_V73_NEWLYWED_APP_INVESTIGATION';
const CASE_META={
 A:{name:'라온빌 502호',emoji:'🏢',price:'전세 1억 5천',ad:'신혼부부 추천 · 첫 입주 · 역 4분 · 풀옵션 · 이자지원'},
 B:{name:'은하주택 301호',emoji:'🏠',price:'전세 1억 5천',ad:'남향 · 역 7분 · “신혼집으로 인기”'},
 C:{name:'행복다가구 202호',emoji:'🏘️',price:'전세 1억 5천',ad:'융자 없음 · 넓은 투룸 · “등기부 깨끗”'},
 D:{name:'스테이오피스텔 1107호',emoji:'🏙️',price:'전세 1억 2천',ad:'역 2분 · 대출 없음 · “조건 맞추면 할인”'},
 E:{name:'센트럴뷰 801호',emoji:'🏢',price:'전세 1억 4천',ad:'신축급 · 역세권 · “원래 주인 직접 계약”'},
 F:{name:'더봄빌라 204호',emoji:'🏡',price:'전세 1억 3천',ad:'조용한 주택가 · 융자 없음 · “집주인 해외체류”'},
 G:{name:'마루아파트 806호',emoji:'🏬',price:'전세 1억 5천',ad:'관리 잘 된 아파트 · 전입 가능 · 소유자 직접 계약'},
 H:{name:'하늘원룸 406호',emoji:'🏠',price:'전세 1억 5천',ad:'“집주인과 10년 거래한 믿을 수 있는 공인중개사”'}
};
const RISK_NAMES={A:'깡통전세',B:'먼저 받을 은행 돈',C:'등기부에 안 보이는 돈',D:'전입신고를 막는 집',E:'신탁·계약 권한',F:'가짜 임대인·대리인',G:'잔금 직전 재확인',H:'허위·이중계약'};
const DEFAULT={
 version:VERSION,mode:'game',scene:'title',history:[],listingOrder:[],
 riskFiles:{A:false,B:false,C:false,D:false,E:false,F:false,G:false,H:false},
 tools:{A:{},B:{},C:{},D:{},E:{},F:{},G:{},H:{}},evidence:{A:[],B:[],C:[],D:[],E:[],F:[],G:[],H:[]},riskFailSeen:{},currentCase:null,
 hDiffs:{deposit:false,rent:false,type:false},finalChecks:{},contractErrors:{unit:false,movein:false,account:false},
 post:{movein:false,resident:false,fixed:false,auction1Step:0,auction1Pot:250000000,auction1Paid:{},auction2Step:0,auction2Pot:250000000,auction2Paid:{},smallTenant:false,termStay:false,termLeave:false,renewRequested:false,renewReason:false,renewRerent:false,raiseCalc:false,raiseTime:false,leaseReg:false},
 badEnds:[],toolReturn:null,auctionError:'',reviewEntry:'game',reviewIndex:0,reviewDone:{},reviewAttempts:{},reviewAnswers:{},reviewOrder:[]
};
let S=load();
function clone(x){return JSON.parse(JSON.stringify(x))}
function shuffled(){return Object.keys(CASE_META).sort(()=>Math.random()-.5)}
function load(){try{const d=JSON.parse(localStorage.getItem(STORE)||'null');if(d&&d.version===VERSION){const s=Object.assign(clone(DEFAULT),d);if(!s.listingOrder.length)s.listingOrder=shuffled();return s}}catch(e){}const s=clone(DEFAULT);s.listingOrder=shuffled();return s}
function save(){localStorage.setItem(STORE,JSON.stringify(S))}
function money(n){return '₩'+Math.round(n).toLocaleString('ko-KR')}
function snap(){S.history.push(S.scene);if(S.history.length>60)S.history.shift()}
function go(id,mut=null,skip=false){if(!skip)snap();if(mut)mut();S.scene=id;save();render();window.scrollTo(0,0)}
function back(){if(!S.history.length)return;S.scene=S.history.pop();save();render();window.scrollTo(0,0)}
function reset(){if(confirm('GAME 2와 CASE REVIEW 진행 상황을 초기화할까요?')){localStorage.removeItem(STORE);S=clone(DEFAULT);S.listingOrder=shuffled();save();render()}}
function head(code,title,sub=''){return `<div class="eyebrow">${code}</div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}`}
function bindChoices(el,fn){el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>fn(b.dataset.v,b))}
function addEvidence(k,text){if(!S.evidence[k].includes(text))S.evidence[k].push(text);save()}
function evidenceHTML(k){return `<div class="evidence"><h3>📌 EVIDENCE BOARD</h3>${S.evidence[k].length?S.evidence[k].map(x=>`<div class="item">• ${x}</div>`).join(''):`<div class="tiny">아직 확보한 단서가 없습니다.</div>`}</div>`}
function toolDone(k,n){return !!S.tools[k][n]}
function allTools(k,list){return list.every(x=>toolDone(k,x))}
function unlockRisk(k){S.riskFiles[k]=true;save();go('riskUnlock',()=>{S.unlockCase=k},true)}
function riskCount(){return Object.values(S.riskFiles).filter(Boolean).length}
function phase(){if(S.mode==='review')return {label:`CASE REVIEW ${Math.min(S.reviewIndex+1,7)}/7`,pct:S.reviewIndex/7*100};const n=riskCount();if(n<8)return {label:`PART A · 위험매물 수사 ${n}/8`,pct:n/12*100};const late=['finalHouse','finalContract','postMovein','postFixed','auction1','auction2','smallTenant','term','renew','raise','exit','leaseReg','gameClear'];const idx=late.indexOf(S.scene);return {label:idx<2?'PART B · FINAL HOUSE':'PART C · 계약 후 생존',pct:idx<0?70:Math.min(100,70+(idx+1)/late.length*30)}}
function hud(){const p=phase(),h=document.querySelector('#hud');h.innerHTML=`<div class="hud1"><span class="stage">${S.mode==='review'?'PART D · CASE REVIEW':'HOUSE FILE · GAME 2'}</span><span class="money">${S.mode==='review'?'복습 모드':'보증금 ₩150,000,000'}</span></div><div class="hud2"><span class="pill">${p.label}</span><span class="pill">📁 ${riskCount()}/8</span><span class="pill">☠ ${S.badEnds.length}</span><button class="hbtn" id="back" ${S.history.length?'':'disabled'}>← 이전</button><button class="hbtn" id="save">💾</button><button class="hbtn" id="reset">↺</button><div class="phase"><div style="width:${p.pct}%"></div></div></div>`;h.querySelector('#back').onclick=back;h.querySelector('#save').onclick=()=>{save();alert('이 브라우저에 저장했습니다.')};h.querySelector('#reset').onclick=reset}
function softFail(el,msg){const f=el.querySelector('#feedback');if(f){f.className='feedback no';f.textContent='❌ '+msg}}
function riskFail(k,msg,returnScene){S.riskFailSeen[k]=true;save();go('riskFail',()=>{S.riskFailData={k,msg,returnScene}},true)}
function badEnd(code,title,msg,returnScene){if(!S.badEnds.includes(code))S.badEnds.push(code);S.badData={code,title,msg,returnScene};save();go('badEnd',null,true)}

{title:'대항력에 확정일자를 더하면?',scene:'전입신고 다음에는 확정일자를 받았고, AUCTION BOSS에서 확정일자가 있는 세계와 없는 세계의 배당 결과를 비교했습니다.',teach:`<b>대항요건을 갖춘 임차인</b>이 임대차계약증서에 <b>확정일자</b>를 갖추면 경매·공매에서 후순위권리자나 그 밖의 채권자보다 우선하여 보증금을 변제받을 수 있는 <b>우선변제권</b>을 갖습니다.<br><br>즉 흐름은 <b>인도 + 전입신고 → 대항력</b>, 그리고 <b>대항요건 + 확정일자 → 우선변제권</b>입니다. 다만 더 먼저 성립한 선순위 담보물권보다 언제나 앞서는 것은 아닙니다.`,remember:'대항요건 + 확정일자 → 우선변제권',q:'확정일자만 받아두면 주택 인도와 주민등록 없이도 우선변제권이 생긴다.',opts:[['O',false],['X',true]],sheet:'학습지 CASE REVIEW 4를 채우세요.'},
{title:'계약 때는 깨끗했는데 왜 잔금 전에 또 볼까?',scene:`매물 G는 계약 당시에는 문제가 없었습니다. 하지만 잔금 직전 최신 등기부에서 새로운 근저당권을 발견했습니다.`,teach:`계약과 잔금 사이에도 소유권이나 담보권 등 권리관계가 달라질 수 있습니다. 그래서 <b>잔금 직전 최신 등기부를 다시 확인</b>하는 것이 중요합니다.<br><br>게임처럼 계약 당시에는 정상이어도, 큰돈을 보내기 직전에 새로운 담보권이 생길 수 있습니다.`,remember:'계약 때 확인 ≠ 잔금 때도 동일 / 큰돈 보내기 전 최신 등기부 재확인',q:'계약할 때 등기부가 깨끗했다면 잔금일에는 다시 볼 필요가 없다.',opts:[['O',false],['X',true]],sheet:'학습지 CASE REVIEW 5를 채우세요.'},
{title:'계약기간·갱신·증액은 어떻게 보호될까?',scene:'1년 계약을 집주인이 종료하려는 상황, 임차인이 1년만 살고 나가려는 상황, 갱신요구와 실제거주 거절, 거짓 실거주 뒤 재임대, 6개월 만의 20% 인상을 차례로 판단했습니다.',teach:`기간을 정하지 않았거나 <b>2년 미만</b>으로 정한 주택임대차는 원칙적으로 <b>2년</b>으로 보지만, 임차인은 자신이 정한 2년 미만의 기간이 유효하다고 주장할 수 있습니다.<br><br>임차인은 <b>계약갱신요구권을 1회</b> 행사할 수 있고, 임대인 또는 직계존속·직계비속의 실제 거주 등 법정 거절사유가 있습니다. 실제 거주를 이유로 거절하고도 정당한 사유 없이 제3자에게 다시 임대한 경우에는 손해배상 문제가 생길 수 있습니다.<br><br>차임·보증금 증액청구는 <b>1년 이내 다시 할 수 없고</b>, 원칙적으로 약정액의 <b>5%</b>를 넘을 수 없습니다.`,remember:'2년 보호는 임차인을 위한 규정 / 갱신요구 1회 + 예외 / 증액은 1년·5%',q:'1년으로 계약했다면 임차인도 반드시 2년을 채워 살아야 한다.',opts:[['O',false],['X',true]],sheet:'학습지 CASE REVIEW 6을 채우세요.'},
{title:'보증금을 못 받고 이사해야 한다면?',scene:'게임 마지막에는 먼저 “임차권등기명령이 무엇을 위한 제도인지” 확인한 뒤, 신청·법원 절차·실제 등기 완료를 구별했습니다.',teach:`임대차가 끝난 뒤 보증금을 돌려받지 못하면 법원에 <b>임차권등기명령</b>을 신청할 수 있습니다. 이미 대항력·우선변제권을 갖춘 임차인이 <b>임차권등기를 마치면</b>, 그 뒤 주택 인도·주민등록이라는 대항요건을 잃더라도 이미 취득한 대항력·우선변제권을 유지할 수 있습니다.<br><br>그래서 이 제도는 단순히 “신청과 완료가 다르다”를 외우는 문제가 아니라, <b>보증금을 못 받은 채 이사해야 할 때 기존 보호를 유지하기 위한 장치</b>입니다.`,remember:'목적: 권리 유지 / 절차: 신청 → 임차권등기 실제 완료 확인 → 이사',q:'임차권등기명령의 핵심 목적은 무엇일까?',opts:[['보증금을 못 받은 채 이사할 때 기존 대항력·우선변제권을 유지하도록 돕는 것',true],['계약기간을 자동으로 2년 더 늘리는 것',false],['집값을 감정평가하는 것',false]],sheet:'학습지 CASE REVIEW 7과 FINAL을 채우세요.'}
]}
function reviewShell(r,i){return `<div class="reviewTop"><div class="reviewNo">CASE REVIEW ${i+1} / 7</div><div class="reviewTitle">${r.title}</div><div class="tiny">게임 장면 → 법으로 해독 → 3초 CHECK → 학습지</div></div><div class="reviewScene"><b>🎮 게임 장면 다시 보기</b><br>${r.scene}</div><div class="reviewTeach"><h3>📚 법으로 보면</h3><div class="body" style="font-size:13.3px">${r.teach}</div></div><div class="remember">⚡ 이것만 기억<br>${r.remember}</div><div class="quiz"><div class="q">3초 CHECK</div><div class="body" style="font-size:13.5px">${r.q}</div><div class="choicegrid">${r.opts.map((o,j)=>`<button class="choice rq" data-i="${j}">${o[0]}</button>`).join('')}</div><div class="feedback" id="fb">${S.reviewDone[i]?`✅ 확인 완료 · ${S.reviewAttempts[i]||1}회 시도`:'정답을 확인하면 학습지 안내가 열립니다.'}</div></div><div class="sheet" id="sheet" style="${S.reviewDone[i]?'':'display:none'}"><b>✎ 지금 학습지!</b><br>${r.sheet}</div><div class="reviewNav"><button class="ghost" id="prev">${i===0?'게임 기록/안내':'← 이전 REVIEW'}</button><button class="primary" id="next" ${S.reviewDone[i]?'':'disabled'}>${i===6?'FINAL REVIEW':'다음 REVIEW →'}</button></div>`}
SC.reviewRecord=el=>{el.innerHTML=head('PART D','내 수사 기록','BAD END를 보지 않았어도 CASE REVIEW에서 모든 위험의 의미를 다시 확인합니다.')+`<div class="progressGrid">${Object.keys(RISK_NAMES).map(k=>`<div class="riskMini done"><b>📁 ${k} · ${RISK_NAMES[k]}</b><div class="tiny">${riskSummary(k)}</div></div>`).join('')}</div><button class="primary" id="go">CASE REVIEW 1 시작</button>`;el.querySelector('#go').onclick=()=>{S.reviewIndex=0;S.scene='review';save();render()}};
SC.review=el=>{S.mode='review';const i=S.reviewIndex,r=reviews()[i];el.innerHTML=reviewShell(r,i);el.querySelectorAll('.rq').forEach(b=>b.onclick=()=>{const fb=el.querySelector('#fb');if(S.reviewDone[i])return;S.reviewAttempts[i]=(S.reviewAttempts[i]||0)+1;const ok=r.opts[Number(b.dataset.i)][1];if(ok){S.reviewDone[i]=true;S.reviewAnswers[i]=Number(b.dataset.i);fb.className='feedback ok';fb.textContent=`✅ 정답 · ${S.reviewAttempts[i]}회 시도`;el.querySelector('#sheet').style.display='block';el.querySelector('#next').disabled=false}else{fb.className='feedback no';fb.textContent=`❌ ${S.reviewAttempts[i]}회째. 바로 위 설명의 핵심 문장을 다시 보세요.`}save()});el.querySelector('#prev').onclick=()=>{if(i===0)go(S.reviewEntry==='game'?'reviewRecord':'title',null,true);else{S.reviewIndex--;save();render();window.scrollTo(0,0)}};el.querySelector('#next').onclick=()=>{if(i===6)go('reviewFinal',null,true);else{S.reviewIndex++;save();render();window.scrollTo(0,0)}}};
SC.reviewFinal=el=>{
 el.innerHTML=head('FINAL REVIEW','전세보증금 방어 지도','모든 행동을 한 줄로 억지로 세우지 말고, 언제 확인하는 일인지 4개 구간으로 묶어 봅니다.')+
 `<div class="panel"><h3>① 계약 전 · “이 집과 이 사람을 믿어도 되나?”</h3><div class="body" style="font-size:13px">🏷 주택가치·보증금 비교　🏦 선순위 부담　👥 기존 세입자 보증금　📜 현재 소유자　🪪 계약 권한</div></div>
 <div class="panel"><h3>② 계약 후 ~ 잔금 전 · “정보가 그대로인가?”</h3><div class="body" style="font-size:13px">📄 계약서 내용 재확인　🔄 잔금 직전 최신 등기부 확인</div></div>
 <div class="panel"><h3>③ 입주 직후 · “내 임대차를 보호하는 장치를 갖췄나?”</h3><div class="body" style="font-size:13px">🏠 주택 인도 + 전입신고 → 대항력　📅 대항요건 + 확정일자 → 우선변제권</div></div>
 <div class="panel"><h3>④ 거주·종료 · “사는 동안과 나갈 때의 보호는?”</h3><div class="body" style="font-size:13px">⏳ 2년 보호　🔁 갱신요구권　📈 증액 제한　🛡 보증금 미반환 시 임차권등기명령</div></div>
 <div class="quiz"><div class="q">FINAL CHECK 1</div><div class="body">새 소유자에게도 임대차를 주장하는 힘과 가장 직접 연결되는 것은?</div>
  <div class="choicegrid"><button class="choice finalQ" data-q="1" data-v="x">확정일자만 받기</button><button class="choice finalQ ${S.reviewOrder.includes('Q1')?'correctPick':''}" data-q="1" data-v="o">주택 인도 + 주민등록 ${S.reviewOrder.includes('Q1')?'✓':''}</button></div></div>
 <div class="quiz"><div class="q">FINAL CHECK 2</div><div class="body">경매에서 후순위권리자보다 우선해 보증금을 변제받는 권리를 갖추려면?</div>
  <div class="choicegrid"><button class="choice finalQ ${S.reviewOrder.includes('Q2')?'correctPick':''}" data-q="2" data-v="o">대항요건 + 확정일자 ${S.reviewOrder.includes('Q2')?'✓':''}</button><button class="choice finalQ" data-q="2" data-v="x">계약서 작성만</button></div></div>
 <div class="quiz"><div class="q">FINAL CHECK 3</div><div class="body">보증금을 못 받은 채 다른 곳으로 이사해야 한다. 가장 적절한 흐름은?</div>
  <div class="choicegrid"><button class="choice finalQ" data-q="3" data-v="x">새집 전입부터 하고 나중에 생각한다</button><button class="choice finalQ ${S.reviewOrder.includes('Q3')?'correctPick':''}" data-q="3" data-v="o">임차권등기명령 이용 → 실제 등기 완료 확인 → 이사 ${S.reviewOrder.includes('Q3')?'✓':''}</button></div></div>
 <div class="feedback" id="finalFb">3문제를 모두 해결하세요. ${S.reviewOrder.length}/3</div>
 <button class="primary" id="done" ${S.reviewOrder.length===3?'':'disabled'}>CASE REVIEW 완료</button>`;
 el.querySelectorAll('.finalQ').forEach(b=>b.onclick=()=>{
   const q=b.dataset.q,key='Q'+q;
   if(S.reviewOrder.includes(key))return;
   if(b.dataset.v==='o'){
     S.reviewOrder.push(key);b.classList.add('correctPick');save();
     const f=el.querySelector('#finalFb');f.className='feedback ok';f.textContent=`✅ FINAL CHECK ${q} 정답 · ${S.reviewOrder.length}/3`;
     if(S.reviewOrder.length===3)el.querySelector('#done').disabled=false
   }else{
     b.classList.add('wrongPick');const box=b.closest('.quiz');box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
     const f=el.querySelector('#finalFb');f.className='feedback no';f.textContent=`❌ FINAL CHECK ${q} 다시 생각하세요.`
   }
 });
 el.querySelector('#done').onclick=()=>{if(S.reviewOrder.length===3)go('reviewComplete',null,true)}
};
SC.reviewComplete=el=>{const rev=reviews(),weak=rev.map((r,i)=>({t:r.title,n:S.reviewAttempts[i]||0})).filter(x=>x.n>=2);el.innerHTML=`<div class="hero"><div class="emoji">🎓🛡️</div><div class="eyebrow">CASE REVIEW CLEAR</div><h1>전세보증금 방어 완료</h1><div class="sub">게임에서 겪은 위험이 이제 법률 개념으로 연결되었습니다.</div></div><div class="panel good"><h3>오늘의 방어 지도</h3><div class="body" style="font-size:13px"><b>계약 전</b> · 집값·선순위 부담·계약권한 확인<br><b>계약 후~잔금 전</b> · 계약서와 최신 등기부 재확인<br><b>입주 직후</b> · 인도+전입신고로 대항력, 대항요건+확정일자로 우선변제권<br><b>거주·종료</b> · 기간·갱신·증액 보호, 보증금 미반환 시 임차권등기명령</div></div><div class="panel blue"><h3>📊 나의 REVIEW 기록</h3>${rev.map((r,i)=>`<div class="tiny" style="margin:6px 0">${i+1}. ${r.title} · ${S.reviewAttempts[i]||0}회</div>`).join('')}${weak.length?`<div class="narrator bad"><b>⚠ 다시 볼 개념</b><br>${weak.map(x=>`• ${x.t} (${x.n}회)`).join('<br>')}</div>`:`<div class="narrator good">✅ 모든 REVIEW를 1회 안에 해결했습니다.</div>`}</div><button class="primary" id="home">처음 화면으로</button>`;el.querySelector('#home').onclick=()=>{S.mode='game';S.scene='title';S.history=[];save();render()}};

function render(){hud();const el=document.querySelector('#stage');el.innerHTML='';(SC[S.scene]||SC.title)(el)}
render();
</script>
</body>
</html>
