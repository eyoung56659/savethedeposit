<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HOUSE FILE · GAME 2 — 전세사기를 피해라!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;700&display=swap');

:root{
  --cream:#FFF7EA; --paper:#FFFFFF; --ink:#241F2B; --soft:#5B5566;
  --money:#1E9E5A; --money-dark:#127A43; --danger:#FF4B4B; --danger-dark:#C2222B;
  --warn:#FFB100; --accent:#6E5DF2; --accent-dark:#4A3BC4; --accent-soft:#EFEBFF;
  --blue:#2C78C8; --blue-soft:#EFF6FF; --line:#E9E1D2;
  --shadow:0 6px 0 rgba(36,31,43,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  background-image:
    radial-gradient(circle at 10% 10%,#FFF1DA 0,transparent 45%),
    radial-gradient(circle at 90% 85%,#F1ECFF 0,transparent 40%);
  color:var(--ink); font-family:'Gowun Dodum',sans-serif;
  min-height:100vh; display:flex; justify-content:center;
}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}

#app{
  width:100%;
  max-width:540px;
  min-height:100vh;
  background:var(--paper);
  box-shadow:0 0 60px rgba(36,31,43,.08);
  position:relative;
  overflow:hidden;
}

#hud{
  position:sticky;
  top:0;
  z-index:60;
  background:var(--ink);
  color:#fff;
  padding:9px 14px 10px;
  border-bottom:4px solid var(--warn);
}

.hud1{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
}

.stagechip{
  font-size:11px;
  color:#ffe9b0;
  opacity:.9;
  flex:1;
}

.moneyhud{
  font-family:'IBM Plex Mono',monospace;
  font-weight:700;
  font-size:19px;
  color:#7CFFB2;
  white-space:nowrap;
}

.hud2{
  display:flex;
  gap:6px;
  margin-top:6px;
  flex-wrap:wrap;
  align-items:center;
}

.pill{
  background:rgba(255,255,255,.08);
  border-radius:999px;
  padding:3px 8px;
  font-size:10.5px;
}

.hbtn{
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.09);
  color:#fff;
  border-radius:8px;
  padding:5px 8px;
  font-size:10.5px;
  cursor:pointer;
}

.hbtn:disabled{
  opacity:.28;
  cursor:not-allowed;
}

#stage{
  padding:22px 20px 48px;
  min-height:calc(100vh - 82px);
  animation:sceneIn .34s ease;
}

@keyframes sceneIn{
  from{
    opacity:0;
    transform:translateY(8px) scale(.99);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--accent);
  font-weight:700;
  letter-spacing:.02em;
}

h1{
  font-family:'Gaegu',cursive;
  font-size:28px;
  margin:4px 0 6px;
  line-height:1.18;
}

h2{
  font-family:'Gaegu',cursive;
}

.sub{
  color:var(--soft);
  font-size:13.5px;
  margin:0 0 16px;
  line-height:1.55;
}

.body{
  font-size:15px;
  line-height:1.75;
  margin:10px 0;
}

.tiny{
  font-size:11.5px;
  color:var(--soft);
  line-height:1.6;
}

.hero{
  text-align:center;
  padding:12px 0;
}

.hero .emoji{
  font-size:54px;
}

.panel{
  border:2px solid var(--line);
  border-radius:15px;
  padding:13px;
  margin:12px 0;
  background:#fff;
}

.panel.dark{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

.panel.warn{
  background:#FFF3D6;
  border-color:var(--warn);
}

.panel.bad{
  background:#FFF0F0;
  border-color:#f0b6ba;
}

.panel.good{
  background:#EAF8EF;
  border-color:#bfe7cf;
}

.panel.blue{
  background:var(--blue-soft);
  border-color:#c9def5;
}

.moneycard{
  background:var(--ink);
  color:#fff;
  border-radius:16px;
  padding:15px 17px;
  margin:14px 0;
}

.moneycard .label{
  font-size:11px;
  opacity:.72;
}

.moneycard .amt{
  font-family:'IBM Plex Mono',monospace;
  font-size:25px;
  font-weight:700;
  margin-top:2px;
}

.moneycard.loss{
  background:#35181b;
}

.moneycard.loss .amt{
  color:#ff8d94;
}

.moneycard.gain .amt{
  color:#84f4b1;
}

.narrator{
  border-left:4px solid var(--accent);
  background:var(--accent-soft);
  border-radius:10px;
  padding:11px 13px;
  margin:13px 0;
  font-size:14px;
  line-height:1.65;
}

.narrator.bad{
  border-color:var(--danger);
  background:#FFF0F0;
}

.narrator.good{
  border-color:var(--money);
  background:#EAF8EF;
}

.npc{
  display:flex;
  gap:9px;
  margin:13px 0;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--warn);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex:none;
}

.bubble{
  border:2px solid var(--line);
  background:#FAF6EC;
  border-radius:14px 14px 14px 3px;
  padding:10px 13px;
  font-size:14px;
  line-height:1.6;
}

.choices{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:15px;
}

.choice{
  border:2px solid var(--ink);
  background:#fff;
  border-radius:14px;
  padding:13px 14px;
  text-align:left;
  box-shadow:var(--shadow);
  cursor:pointer;
  font-size:14.5px;
}

.choice:active{
  transform:translateY(3px);
  box-shadow:none;
}

.choice.done{
  border-color:var(--money);
  background:#F3FBF6;
  box-shadow:none;
}

.choice small{
  display:block;
  color:var(--soft);
  font-size:11.5px;
  line-height:1.5;
  margin-top:4px;
}

.primary{
  width:100%;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
  padding:14px 16px;
  font-size:15px;
  box-shadow:0 6px 0 var(--accent-dark);
  margin-top:16px;
  cursor:pointer;
}

.primary:disabled{
  background:#CFC9DA;
  box-shadow:0 6px 0 #B4ADC4;
  cursor:not-allowed;
}

.primary:active:not(:disabled){
  transform:translateY(3px);
  box-shadow:none;
}

.ghost{
  width:100%;
  border:2px dashed var(--accent);
  background:#fff;
  color:var(--accent);
  font-weight:700;
  border-radius:14px;
  padding:11px 13px;
  margin-top:9px;
  cursor:pointer;
}

.stat{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 1px;
  border-bottom:1px dashed var(--line);
  font-size:13.5px;
}

.stat:last-child{
  border-bottom:none;
}

.stat b{
  font-family:'IBM Plex Mono',monospace;
  text-align:right;
}

.tag{
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  background:var(--ink);
  color:#fff;
  border-radius:6px;
  padding:1px 6px;
  margin-right:8px;
}

.castgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.cast{
  border:2px solid var(--line);
  border-radius:15px;
  padding:13px;
  background:#fff;
}

.cast .face{
  font-size:34px;
}

.cast h3{
  margin:4px 0;
  font-size:15px;
}

.cast p{
  font-size:11.5px;
  color:var(--soft);
  line-height:1.55;
  margin:0;
}

.docgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.doc{
  border:2px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:11px;
  text-align:left;
  cursor:pointer;
  min-height:80px;
}

.doc.done{
  border-color:var(--money);
  background:#F3FBF6;
}

.doc b{
  display:block;
  font-size:13px;
}

.doc span{
  font-size:11px;
  color:var(--soft);
  line-height:1.4;
}

.flagrow{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.flag,
.safe{
  font-size:10px;
  border-radius:999px;
  padding:4px 7px;
}

.flag{
  background:#FFF0F0;
  color:#a72830;
}

.safe{
  background:#EAF8EF;
  color:#176940;
}

.private{
  background:#17132c;
  color:#fff;
  border-radius:18px;
  padding:20px;
  margin:12px 0;
}

.private h2{
  font-size:23px;
  color:#c6bbff;
  margin:4px 0;
}

.private p{
  font-size:13px;
  line-height:1.7;
  color:#e4def1;
}

.passscreen{
  background:#17132c;
  color:#fff;
  border-radius:18px;
  padding:30px 18px;
  text-align:center;
}

.timer{
  font-family:'IBM Plex Mono',monospace;
  font-weight:700;
  font-size:34px;
  text-align:center;
  color:var(--accent);
  margin:12px 0;
}

.shieldrow{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:14px 0;
}

.shield{
  border:2px dashed #cabfd6;
  border-radius:13px;
  padding:11px 5px;
  text-align:center;
  font-size:11px;
  color:var(--soft);
  min-height:76px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.shield .ico{
  font-size:23px;
}

.shield.on{
  border-style:solid;
  border-color:var(--money);
  background:#F3FBF6;
  color:var(--ink);
}

.shield.locked{
  border-style:solid;
  border-color:var(--accent);
  background:var(--accent-soft);
  color:var(--ink);
}

.law{
  border:2px solid #cae0f7;
  background:#f2f8ff;
  border-radius:14px;
  padding:11px 12px;
  margin:12px 0;
}

.law b{
  color:#2364a3;
  font-size:12.5px;
}

.law div{
  font-size:11.5px;
  color:#45596c;
  line-height:1.62;
  margin-top:4px;
}

.order{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
  border:2px solid var(--line);
  border-radius:13px;
  padding:10px;
  margin:8px 0;
}

.order b{
  display:block;
  font-size:13px;
}

.order span{
  font-size:11px;
  color:var(--soft);
  line-height:1.45;
}

.arrows{
  display:flex;
  gap:4px;
}

.arrow{
  width:32px;
  height:32px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  cursor:pointer;
  font-weight:700;
}

.pot{
  background:var(--ink);
  color:#fff;
  border-radius:16px;
  padding:14px;
  text-align:center;
  margin:12px 0;
}

.pot .big{
  font-family:'IBM Plex Mono',monospace;
  font-weight:700;
  font-size:27px;
  color:#86f4b3;
}

.claim{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
  border:2px solid var(--line);
  border-radius:12px;
  padding:10px;
  margin:7px 0;
}

.claim.paid{
  border-color:var(--money);
  background:#F3FBF6;
}

.claim.zero{
  border-color:#bbb;
  background:#f7f7f7;
}

.claim b{
  font-size:13px;
}

.claim span{
  display:block;
  font-size:11px;
  color:var(--soft);
  margin-top:3px;
  line-height:1.45;
}

.paybtn{
  border:none;
  background:var(--ink);
  color:#fff;
  border-radius:8px;
  padding:8px 10px;
  font-size:11px;
  cursor:pointer;
}

.paybtn:disabled{
  opacity:.35;
}

.checkrow{
  display:flex;
  gap:9px;
  align-items:flex-start;
  border:2px solid var(--line);
  border-radius:12px;
  padding:10px;
  margin:7px 0;
  background:#fff;
}

.checkrow input{
  margin-top:3px;
  transform:scale(1.2);
}

.checkrow b{
  display:block;
  font-size:12.5px;
}

.checkrow span{
  font-size:11.5px;
  color:var(--soft);
  line-height:1.5;
}

.evidence{
  border:2px solid var(--line);
  border-radius:13px;
  padding:10px;
  margin:7px 0;
}

.evidence b{
  font-size:12.5px;
}

.evbtns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:7px;
}

.evbtn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:7px;
  font-size:11px;
  cursor:pointer;
}

.evbtn.on{
  border-color:var(--accent);
  background:var(--accent-soft);
  color:#4b3cba;
  font-weight:700;
}

.conceptbox{
  border:2px solid var(--warn);
  background:#FFF6DA;
  border-radius:14px;
  padding:12px 14px;
  margin:16px 0;
  font-size:12.5px;
  line-height:1.8;
}

.calcbox{
  border:2px solid var(--ink);
  border-radius:15px;
  padding:14px;
  background:#fff;
  margin:12px 0;
}

.calcbox input{
  width:100%;
  border:2px solid var(--line);
  border-radius:11px;
  padding:12px;
  font-family:'IBM Plex Mono',monospace;
  font-size:18px;
  margin-top:9px;
}

.calcbox input:focus{
  outline:none;
  border-color:var(--accent);
}

.progress{
  height:12px;
  background:#eee7da;
  border-radius:999px;
  overflow:hidden;
  margin:10px 0;
}

.progress>div{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--money));
  transition:width .35s;
}

.badend{
  background:#1b1420;
  color:#fff;
  margin:-22px -20px -48px;
  padding:38px 22px;
  min-height:calc(100vh - 82px);
  text-align:center;
}

.badend .skull{
  font-size:48px;
}

.badend h1{
  color:#ff727a;
}

.badend p{
  text-align:left;
  font-size:13.5px;
  line-height:1.72;
}

.retry{
  width:100%;
  border:none;
  border-radius:14px;
  background:#ff727a;
  color:#1b1420;
  font-weight:700;
  padding:14px;
  margin-top:16px;
  cursor:pointer;
}

.parallel{
  background:#15112b;
  color:#fff;
  border-radius:18px;
  padding:20px;
  margin:12px 0;
}

.parallel h2{
  font-size:24px;
  color:#c6bbff;
  margin:3px 0;
}

.parallel p{
  font-size:13px;
  line-height:1.7;
  color:#e4def1;
}

.clear{
  text-align:center;
}

.cup{
  font-size:56px;
}

#restartFab{
  position:fixed;
  bottom:16px;
  right:calc(50% - 270px + 16px);
  z-index:80;
  background:var(--ink);
  color:#fff;
  border:none;
  border-radius:999px;
  width:42px;
  height:42px;
  font-size:16px;
  cursor:pointer;
  opacity:.35;
}

/* EVENT BREAK */

.eventBreak{
  min-height:64vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  padding:24px 4px;
  position:relative;
}

.eventBreak::before{
  content:'';
  position:absolute;
  inset:-22px -20px -48px;
  z-index:-1;
  background:radial-gradient(circle at center,#fff 0,#fff 42%,#f8f4ec 100%);
}

.eventBreak.danger::before{
  background:radial-gradient(circle at center,#fff 0,#fff 38%,#ffe7e7 100%);
}

.eventBreak.good::before{
  background:radial-gradient(circle at center,#fff 0,#fff 38%,#e5f8ec 100%);
}

.eventBreak.notice::before{
  background:radial-gradient(circle at center,#fff 0,#fff 38%,#eeeaff 100%);
}

.eventTime{
  display:inline-block;
  align-self:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  font-weight:700;
  color:var(--soft);
  background:#f4f0e8;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 12px;
  margin-bottom:18px;
}

.eventIcon{
  font-size:58px;
  line-height:1;
  animation:eventDrop .55s cubic-bezier(.2,.9,.25,1.25);
}

.eventLabel{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.1em;
  color:var(--danger);
  margin-top:12px;
}

.eventBreak.good .eventLabel{
  color:var(--money-dark);
}

.eventBreak.notice .eventLabel{
  color:var(--accent);
}

.eventTitle{
  font-family:'Gaegu',cursive;
  font-size:35px;
  margin:6px 0 9px;
  line-height:1.1;
}

.eventMessage{
  border:2px solid var(--line);
  background:rgba(255,255,255,.92);
  border-radius:15px;
  padding:13px 14px;
  font-size:13.5px;
  line-height:1.68;
  margin:8px 0;
  box-shadow:var(--shadow);
}

.eventQuestion{
  font-family:'Gaegu',cursive;
  font-size:20px;
  line-height:1.35;
  margin:15px 4px 2px;
}

.eventBreak.danger .eventQuestion{
  color:var(--danger-dark);
}

.eventBreak.good .eventQuestion{
  color:var(--money-dark);
}

.eventBreak.notice .eventQuestion{
  color:var(--accent-dark);
}

.eventBadge{
  display:inline-block;
  align-self:center;
  margin-top:8px;
  padding:5px 9px;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  background:#fff;
  border:1px solid var(--line);
}

.eventAlert{
  margin:11px 0 2px;
  border:2px solid var(--danger);
  background:#fff;
  border-radius:15px;
  padding:11px 13px;
  text-align:left;
  animation:eventPulse .8s ease;
}

.eventAlert.good{
  border-color:var(--money);
}

.eventAlert .source{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:700;
  color:var(--soft);
  margin-bottom:5px;
}

.eventAlert b{
  font-size:14px;
}

@keyframes eventDrop{
  0%{
    opacity:0;
    transform:translateY(-35px) scale(.55);
  }
  65%{
    opacity:1;
    transform:translateY(5px) scale(1.14);
  }
  100%{
    transform:none;
  }
}

@keyframes eventPulse{
  0%{
    transform:scale(.94);
    opacity:.2;
  }
  45%{
    transform:scale(1.025);
    opacity:1;
  }
  100%{
    transform:scale(1);
  }
}

/* EFFECTS */

.scrim{
  position:fixed;
  inset:0;
  background:rgba(20,16,28,.55);
  z-index:220;
  animation:fade .18s ease;
}

.popup{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.76);
  width:min(88vw,430px);
  background:#fff;
  border:3px solid var(--ink);
  border-radius:20px;
  padding:18px;
  z-index:230;
  box-shadow:0 18px 0 rgba(36,31,43,.18);
  animation:popupIn .28s cubic-bezier(.18,.8,.32,1.3) forwards;
}

.popup .icon{
  font-size:42px;
  text-align:center;
}

.popup h2{
  font-size:25px;
  margin:3px 0 8px;
  text-align:center;
}

.popup button{
  width:100%;
  margin-top:14px;
  border:none;
  border-radius:12px;
  padding:12px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.shake{
  animation:shake .38s ease;
}

.flashBad{
  animation:flashBad .55s ease;
}

.flashGood{
  animation:flashGood .55s ease;
}

.zoomHit{
  animation:zoomHit .6s ease;
}

.pulse{
  animation:pulse .75s ease;
}

.moneyFloat{
  position:fixed;
  left:50%;
  top:41%;
  z-index:245;
  font-family:'IBM Plex Mono',monospace;
  font-size:30px;
  font-weight:700;
  color:#ff5964;
  text-shadow:0 2px 0 #fff;
  pointer-events:none;
  animation:moneyFly 1.05s ease forwards;
}

.unlockBurst{
  position:fixed;
  left:50%;
  top:46%;

function clone(x){
  return JSON.parse(JSON.stringify(x));
}

function deepMerge(base,extra){
  const out=clone(base);

  Object.keys(extra||{}).forEach(k=>{
    if(
      extra[k] &&
      typeof extra[k]==='object' &&
      !Array.isArray(extra[k]) &&
      out[k] &&
      typeof out[k]==='object' &&
      !Array.isArray(out[k])
    ){
      out[k]=deepMerge(out[k],extra[k]);
    }else{
      out[k]=extra[k];
    }
  });

  return out;
}

function load(){
  try{
    const r=JSON.parse(localStorage.getItem(STORE)||'null');
    return r ? deepMerge(DEF,r) : clone(DEF);
  }catch(e){
    return clone(DEF);
  }
}

function loadH(){
  try{
    const r=JSON.parse(localStorage.getItem(HIST)||'[]');
    return Array.isArray(r) ? r : [];
  }catch(e){
    return [];
  }
}

function save(){
  localStorage.setItem(STORE,JSON.stringify(S));
  localStorage.setItem(HIST,JSON.stringify(H));
}

function money(n){
  return '₩'+Math.round(n||0).toLocaleString('ko-KR');
}

function unlockSilent(name){
  if(!S.concepts.includes(name)){
    S.concepts.push(name);
  }
}

function setCP(id){
  S.checkpoint=id;
}

function snap(){
  H.push(clone(S));

  if(H.length>55){
    H.shift();
  }
}

function go(id,mut,opt){
  opt=opt||{};

  if(!opt.skip){
    snap();
  }

  if(mut){
    mut();
  }

  S.scene=id;
  save();
  render();
  window.scrollTo(0,0);
}

function back(){
  if(!H.length){
    return;
  }

  S=H.pop();
  save();
  render();
  window.scrollTo(0,0);
}

function resetAll(){
  if(!confirm('GAME 2 진행 상황을 모두 초기화할까요?')){
    return;
  }

  localStorage.removeItem(STORE);
  localStorage.removeItem(HIST);

  S=clone(DEF);
  H=[];

  render();
}

document.getElementById('restartFab').onclick=resetAll;

function recordBad(code){
  if(!S.badEnds.includes(code)){
    S.badEnds.push(code);
    S.lossLedger[code]=BAD[code].loss;
  }
}

function vibrate(ms){
  try{
    if(navigator.vibrate){
      navigator.vibrate(ms||40);
    }
  }catch(e){}
}

function fx(kind){
  const a=document.getElementById('app');

  a.classList.remove(
    'shake',
    'flashBad',
    'flashGood',
    'zoomHit'
  );

  void a.offsetWidth;

  if(kind==='bad'){
    a.classList.add(
      'shake',
      'flashBad'
    );

    vibrate(80);
  }

  if(kind==='good'){
    a.classList.add(
      'flashGood',
      'zoomHit'
    );
  }
}

  setTimeout(

}

function confettiBurst(){
  for(let i=0;i<32;i++){
    const d=document.createElement('div');

    d.className='confetti';

    d.style.left=
      Math.random()*100+'vw';

    d.style.background=[
      '#6E5DF2',
      '#FFB100',
      '#1E9E5A',
      '#FF4B4B'
    ][i%4];

    d.style.animationDelay=
      (Math.random()*.45)+'s';

    document.body.appendChild(d);

    setTimeout(
      ()=>d.remove(),
      2300
    );
  }
}

function popup(icon,title,body,cb,label){
  const scr=document.createElement('div');

  scr.className='scrim';

  const p=document.createElement('div');

  p.className='popup';

  p.innerHTML=`
    <div class="icon">
      ${icon}
    </div>

    <h2>
      ${title}
    </h2>

    <div style="font-size:13.5px;line-height:1.72;">
      ${body}
    </div>

    <button>
      ${label||'확인'}
    </button>
  `;

  document.body.append(scr,p);

  p.querySelector('button').onclick=()=>{
    scr.remove();
    p.remove();

    if(cb){
      cb();
    }
  };
}

      go(
        'privateJ',
        ()=>{
          S.activeDoc=null;
          S.feedback='';
          setCP('privateJ');
        }
      );
  }
};

          width:${
            (step+1)/
            steps.length*
            100
          }%
        "
      ></div>

    </div>

    <div class="panel">

      ${steps.map((x,i)=>`
        <div class="stat">

          <span>
            ${x}
          </span>

          <b>
            ${
              i<step
              ? '✅'
              :
              i===step
              ?
                (
                  step===3
                  ? '✅'
                  : '⏳'
                )
              :
              '—'
            }
          </b>

        </div>
      `).join('')}

    </div>

    ${
      step<3
      ?
      `
      <button
        class="primary"
        id="next"
      >
        처리 상태 다시 확인
      </button>
      `
      :
      `
      <div class="narrator good pulse">

        <b>
          ✅ 임차권등기 완료
        </b>
        <br>

        이제 이사 후
        주택의 점유와 주민등록을 잃더라도
        이미 취득한 대항력·우선변제권은 유지됩니다.

      </div>

      <div class="shieldrow">

        <div class="shield locked">

          <div class="ico">
            🛡️
          </div>

          대항력
          <br>
          LOCKED

        </div>

        <div class="shield locked">

          <div class="ico">
            💰
          </div>

          우선변제권
          <br>
          LOCKED

        </div>

        <div class="shield on">

          <div class="ico">
            📜
          </div>

          임차권등기
          <br>
          완료

        </div>

      </div>

      ${
        law(
          '주택임대차보호법 제3조의3 제5항',
          '임차권등기를 마치면 대항력과 우선변제권을 취득합니다. 이미 그 권리를 취득한 임차인은 임차권등기 이후 대항요건을 상실하더라도 기존 대항력·우선변제권을 잃지 않습니다.'
        )
      }

      <button
        class="primary"
        id="move"
      >
        🚚 MOVE OUT
      </button>
      `
    }
  `;

  const n=
    el.querySelector('#next');

  if(n){
    n.onclick=()=>{
      S.leaseRegStep++;

      save();

      fx('good');

      render();
    };
  }

  const m=
    el.querySelector('#move');

  if(m){
    m.onclick=()=>
      concept(
        '임차권등기 완료 후 권리 보전',
        'FINAL BOSS CLEAR. 보증금을 돌려받지 못한 채 이사해야 할 때는 신청 자체가 아니라 임차권등기의 완료를 확인하는 것이 핵심입니다.',
        ()=>go(
          'clear',
          ()=>S.protected=C.deposit
        ),
        'master'
      );
  }
};

/* CLEAR */

SC.clear=el=>{
  confettiBurst();

  const loss=
    Object.values(
      S.lossLedger
    )
    .reduce(
      (a,b)=>a+b,
      0
    );

  el.innerHTML=`
    <div class="clear">

      <div class="cup">
        🏆
      </div>

      <div class="eyebrow">
        CASE 02 CLOSED
      </div>

      <h1>
        DEPOSIT SURVIVED
      </h1>

      <p class="sub">
        법률용어를 먼저 외운 것이 아니라,
        사건에서 필요성을 발견하고
        같은 공격을 다시 막아냈습니다.
      </p>

    </div>

    <div class="moneycard gain">

      <div class="label">
        보존한 보증금
      </div>

      <div class="amt">
        ${money(S.protected||C.deposit)}
        /
        ${money(C.deposit)}
      </div>

    </div>

    <div class="stat">
      <span>발견한 RED FLAG</span>
      <b>${S.flags.length}</b>
    </div>

    <div class="stat">
      <span>실제 경험한 BAD END</span>
      <b>${S.badEnds.length}</b>
    </div>

    <div class="stat">
      <span>환생 횟수</span>
      <b>${S.reincarnations}</b>
    </div>

    <div class="stat">
      <span>실패세계 손실 합계</span>
      <b>${money(loss)}</b>
    </div>

    <div class="conceptbox">

      <b>
        📚 오늘의 법률도감
      </b>

      <br>

      ${S.concepts.join(' · ')}

    </div>

    <div
      class="panel dark"
      style="text-align:center"
    >

      <b>
        계약서를 썼기 때문에 살아남은 것이 아니다.
      </b>

      <p
        class="tiny"
        style="color:#ddd"
      >
        계약 전에는 위험을 찾고,
        <br>

        계약 후에는 권리를 만들고,
        <br>

        이사할 때는 그 권리를 보존했기 때문에 살아남았다.
      </p>

    </div>

    <button
      class="primary"
      id="again"
    >
      처음부터 다시 플레이
    </button>
  `;

  el.querySelector('#again').onclick=
    resetAll;
};

/* BAD END */

SC.badend=el=>{
  const b=
    BAD[S.activeBad];

  el.innerHTML=`
    <section class="badend">

      <div class="skull">
        ☠
      </div>

      <div
        class="eyebrow"
        style="color:#ffb0b5"
      >
        BAD END · ${S.activeBad}
      </div>

      <h1>
        「${b.title}」
      </h1>

      <div
        class="moneycard loss"
        style="text-align:left"
      >

        <div class="label">
          실패세계의 게임상 손실
        </div>

        <div class="amt">
          - ${money(b.loss)}
        </div>

      </div>

      <p>
        ${b.story}
      </p>

      <div
        class="tiny"
        style="color:#cabfd0"
      >
        손실액은 수업용 사건 설정값이며
        실제 법정 손해액이나
        실제 경매 배당액으로 일반화할 수 없습니다.
      </div>

      <button
        class="retry"
        id="re"
      >
        ♻ 원인 하나 배웠다 — 체크포인트로 환생
      </button>

    </section>
  `;

  el.querySelector('#re').onclick=
    reincarnate;
};

function render(){
  renderHUD();

  const el=
    document.getElementById('stage');

  (
    SC[S.scene]
    ||
    SC.cast
  )(el);
}

render();

</script>
</body>
</html>
